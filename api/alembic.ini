# Alembic configuration for explorer-api.
#
# There is deliberately no sqlalchemy.url here: the database URL is a secret and
# comes from the environment (DATABASE_URL), like every other one. `env.py` reads
# it and fails with a named error when it is absent.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Revision files sort by date, so `history` reads in the order things happened.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
