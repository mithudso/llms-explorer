[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
# Lint only the actively maintained package + tests; legacy flat scripts are
# out of scope until individually adopted.
include = ["scripts/hub_manager/**/*.py", "scripts/semantic_ops/**/*.py", "scripts/docset_refine/**/*.py", "scripts/llms_acquire.py", "scripts/llms_lint.py", "scripts/llms_full_catalog.py", "scripts/docset_rollout.py", "tests/**/*.py", "pyproject.toml"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = [
    "E402",  # deliberate late imports after sys.path setup
    "BLE001",  # broad excepts are annotated inline where intentional
    "SIM105",  # contextlib.suppress not always clearer
]
