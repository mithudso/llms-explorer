version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/hub"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    ignore:
      # @astrojs/check 0.9.x peers typescript ^5 || ^6; a 7.x bump fails npm ci
      # with ERESOLVE. Drop this once @astrojs/check accepts typescript 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
