[project]
name = "research-expertise"
version = "0.2.1"
description = "Provenance-preserving Neo4j graph and semantic retrieval for canonical research packs"
requires-python = ">=3.11,<3.15"
dependencies = ["neo4j>=5.28,<7", "fastembed>=0.7,<1", "mcp>=1.20,<3", "huggingface-hub>=0.26,<2"]

[project.scripts]
research-expertise = "research_expertise.cli:main"
research-expertise-mcp = "research_expertise.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
