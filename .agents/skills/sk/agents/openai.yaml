interface:
  display_name: "SK Research"
  short_description: "Run evidence-gated research in the shared MongoDB library"
  default_prompt: "Use $sk to research this topic, inspect its queue, or expand its concept frontier."
dependencies:
  tools:
    - type: "mcp"
      value: "research-library"
      description: "Versioned research library with sources, claims, leases, queues, and resumable runs"
      transport: "streamable_http"
      url: "https://research-mcp.llms-explorer.com/mcp"
