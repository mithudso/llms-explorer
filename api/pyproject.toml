[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explorer-api"
version = "0.1.0"
description = "Accounts, metering, hosted MCP gateway and governance for LLMS-Explorer"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    # Verified supported baseline exporting the NoDecode annotation we import.
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    # Task 3 — sign-in: signed session/ceremony cookies, WebAuthn, OAuth clients.
    "itsdangerous>=2.2",
    "webauthn>=2.0",
    "httpx>=0.27",
    "argon2-cffi>=23.1.0",
    # StripeClient.v1 was introduced in 12.5.0.
    "stripe>=12.5.0",
    # The showcase skills surface (`routes/skills.py`) — the only place this
    # service calls a model provider.
    "anthropic>=0.40",
    # `secrets_crypto.py` wraps this directly for at-rest encryption of a
    # caller's own stored Anthropic key — already pulled in transitively by
    # httpx/anthropic's TLS stack, but declared explicitly since we import it.
    "cryptography>=42",
    # `moderation.py` imports the hub's `llms_lint`, which is now a shim over this
    # library (stdlib-only, private repo; locally: pip install -e ~/dev/libraries/llms-txt).
    "llms-txt @ git+https://github.com/mithudso/llms-txt",
    # Shared release/bundle contracts used by local and hosted skill clients.
    "skill-registry==0.1.0",
]

[project.optional-dependencies]
# Added task by task as each surface lands (Task 2: sqlalchemy/alembic/asyncpg,
# Task 3: webauthn/authlib, Task 4: argon2-cffi, Task 6: stripe).
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["explorer_api*"]

[tool.uv.sources]
skill-registry = { path = "../hub/skill-registry", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Task 2's database tests are `async def` with no decorator, as the plan writes them.
asyncio_mode = "auto"
