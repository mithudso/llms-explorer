[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsx"
version = "0.1.0"
description = "Read-only CLI and TUI over the generated llms-explorer concept tree"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Textual is an EXTRA on purpose: `llmsx tree …` must run with no third-party
# dependency at all, so CI and a bare box can use it. Only `llmsx tui` needs it.
tui = ["textual>=8,<9"]
# Same rule for the skills SDK: `llmsx.skills` loads and parses SKILL.md with
# no third-party dependency at all (PyYAML is used when importable, and a
# bounded subset parser covers the frontmatter these files actually use when
# it is not). This extra is only for `run_skill`'s *default* client — a caller
# injecting their own transport never needs it.
skills = ["anthropic>=0.40", "PyYAML>=6"]

[project.scripts]
llmsx = "llmsx.__main__:main"

[tool.setuptools.packages.find]
include = ["llmsx*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E402", "BLE001", "SIM105"]
