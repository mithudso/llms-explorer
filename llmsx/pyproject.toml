[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsx"
version = "0.1.0"
description = "Read-only CLI and TUI over the generated llms-explorer concept tree"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Textual is an EXTRA on purpose: `llmsx tree …` must run with no third-party
# dependency at all, so CI and a bare box can use it. Only `llmsx tui` needs it.
tui = ["textual>=8,<9"]

[project.scripts]
llmsx = "llmsx.__main__:main"

[tool.setuptools.packages.find]
include = ["llmsx*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E402", "BLE001", "SIM105"]
