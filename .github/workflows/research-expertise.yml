name: Research expertise
on:
  pull_request:
    paths:
      - 'hub/research-expertise/**'
      - '.github/workflows/research-expertise.yml'
  push:
    branches: [main]
    paths:
      - 'hub/research-expertise/**'
      - '.github/workflows/research-expertise.yml'
jobs:
  expertise-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --directory hub/research-expertise --frozen
      - run: uv run --directory hub/research-expertise ruff check src tests install.py
      - run: uv run --directory hub/research-expertise pytest -q
