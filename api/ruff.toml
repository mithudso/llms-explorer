# Lint config for explorer-api. Mirrors site/ruff.toml (which mirrors the hub's
# hub/pyproject.toml [tool.ruff]) rule set exactly, so a file that moves between
# the trees lints the same way.
target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = [
    "E402",    # deliberate late imports after sys.path setup
    "BLE001",  # broad excepts are annotated inline where intentional
    "SIM105",  # contextlib.suppress not always clearer
]

[lint.per-file-ignores]
# Alembic writes its own revision files; they are generated, reviewed and then
# left alone, so the line length is the generator's business, not ours. Every
# hand-written addition to a revision (triggers, seed data) stays within it.
"alembic/versions/*.py" = ["E501"]
