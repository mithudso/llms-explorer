{
  "global": {
    "scrape_interval": "30s",
    "evaluation_interval": "30s",
    "external_labels": {
      "monitor": "llmsx-fleet"
    }
  },
  "rule_files": [
    "/etc/prometheus/alerts.yml"
  ],
  "scrape_configs": [
    {
      "job_name": "prometheus",
      "static_configs": [
        {
          "targets": [
            "localhost:9090"
          ]
        }
      ]
    },
    {
      "job_name": "fleet",
      "scrape_interval": "30s",
      "static_configs": [
        {
          "targets": [
            "host.docker.internal:9321"
          ]
        }
      ]
    },
    {
      "job_name": "loki",
      "static_configs": [
        {
          "targets": [
            "loki:3100"
          ]
        }
      ]
    },
    {
      "job_name": "websites",
      "metrics_path": "/probe",
      "scrape_interval": "60s",
      "scrape_timeout": "15s",
      "params": {
        "module": [
          "website"
        ]
      },
      "static_configs": [
        {
          "targets": [
            "https://llmsx.org/"
          ],
          "labels": {
            "project": "llmsx",
            "phase": "production"
          }
        },
        {
          "targets": [
            "https://llms-explorer.com/"
          ],
          "labels": {
            "project": "llms-explorer",
            "phase": "production"
          }
        },
        {
          "targets": [
            "https://oraclebot.io/"
          ],
          "labels": {
            "project": "oraclebot",
            "phase": "production"
          }
        },
        {
          "targets": [
            "https://thatswhatshesaid.games/"
          ],
          "labels": {
            "project": "twss",
            "phase": "production"
          }
        },
        {
          "targets": [
            "https://morelube.com/"
          ],
          "labels": {
            "project": "morelube",
            "phase": "production"
          }
        },
        {
          "targets": [
            "https://skaas.io/"
          ],
          "labels": {
            "project": "skaas",
            "phase": "production"
          }
        },
        {
          "targets": [
            "https://netdnsmonitor.com/"
          ],
          "labels": {
            "project": "netdnsmonitor",
            "phase": "production"
          }
        }
      ],
      "relabel_configs": [
        {
          "source_labels": [
            "__address__"
          ],
          "target_label": "__param_target"
        },
        {
          "source_labels": [
            "__param_target"
          ],
          "target_label": "instance"
        },
        {
          "target_label": "__address__",
          "replacement": "blackbox:9115"
        }
      ]
    }
  ]
}
