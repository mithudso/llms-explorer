interface:
  display_name: "Deep Research in MongoDB"
  short_description: "Research a topic through the shared MongoDB library"
  default_prompt: "Use $dr to research the topic through the shared MongoDB library and save evidence-bound draft claims."

dependencies:
  tools:
    - type: "mcp"
      value: "research-library"
      description: "Shared MongoDB research library"
      transport: "streamable_http"
      url: "https://research-mcp.llms-explorer.com/mcp"
