[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-registry"
version = "0.1.0"
description = "Source-bound local skill routing, portable releases and bounded optimizer jobs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<3"]
mongo = ["pymongo>=4.15,<5", "python-dotenv>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mcp>=1.30,<3"]

[project.scripts]
skill-registry = "skill_registry.cli:main"
skill-registry-mcp = "skill_registry.mcp_server:main"
skill-registry-mongo-mcp = "skill_registry.mongo_mcp:main"
skill-registry-prompt-hook = "skill_registry.prompt_hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
