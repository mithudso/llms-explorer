<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  html, body { margin: 0; background: var(--paper); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--paper); }
  .cover svg { position: absolute; inset: 0; }
  .accent { fill: var(--accent); }
  .ink { fill: var(--ink); }
  .soft { fill: var(--accent-soft); }
  .blk { rx: var(--radius); }
  .rule { stroke: var(--line-strong); stroke-width: 1; }
  .dot { fill: var(--accent); }
  .text { position: absolute; left: 48px; bottom: 32px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-mono); font-weight: 700; font-size: 120px; line-height: 0.95; letter-spacing: -0.01em; color: var(--ink); }
  .tag { margin: 16px 0 0; font-family: var(--font-body); font-size: 14px; line-height: 1.4; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: accent 144x288 (2 x sp-8, full height); ink 128x176 (8 x 11 sp-4); accent-soft 128x96 (8 x 6 sp-4); about 28% of the cover.
      arrangement: one tall slab with two satellites stacked to its right, both bleeding off the right edge, sp-4 gaps.
      pattern: editorial row, "borders not shadows" and a site that is an indented outline: five line-strong hairlines indented like tree levels, with accent dots for the haspack marker.
      scales: rule pitch sp-6 (32px), indent sp-4 (16px), gaps sp-4, block corners radius (6px), dot radius 3px.
    -->
    <line class="rule" x1="524" y1="72" x2="656" y2="72"/>
    <line class="rule" x1="540" y1="104" x2="656" y2="104"/>
    <line class="rule" x1="556" y1="136" x2="656" y2="136"/>
    <line class="rule" x1="540" y1="168" x2="656" y2="168"/>
    <line class="rule" x1="524" y1="200" x2="656" y2="200"/>
    <circle class="dot" cx="512" cy="72" r="3"/>
    <circle class="dot" cx="544" cy="136" r="3"/>
    <circle class="dot" cx="528" cy="168" r="3"/>
    <rect class="accent blk" x="672" y="-8" width="144" height="304"/>
    <rect class="ink blk" x="832" y="-8" width="136" height="184"/>
    <rect class="soft blk" x="832" y="192" width="136" height="104"/>
  </svg>
  <div class="text">
    <p class="name">llmsx</p>
    <p class="tag">Paper, graphite and one steel-blue accent.</p>
  </div>
</div>
</body>
</html>
