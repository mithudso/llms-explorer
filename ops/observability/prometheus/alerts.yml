{
  "groups": [
    {
      "name": "fleet",
      "rules": [
        {
          "alert": "OffhostWatchdogFailure",
          "expr": "fleet_watchdog_success{phase=\"production\"} == 0",
          "for": "3m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Independent HTTP monitor reports a production outage",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "OffhostWatchdogStale",
          "expr": "time() - fleet_watchdog_checked_timestamp_seconds > 180",
          "for": "3m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Independent monitoring history stopped updating",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "WebsiteUnavailable",
          "expr": "probe_success{job=\"websites\",phase=\"production\"} == 0",
          "for": "3m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Public website is unavailable or returns an access/challenge page",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "BackendUnavailable",
          "expr": "fleet_check_success{phase=\"production\"} == 0",
          "for": "3m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "A backend or origin check failed",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "BackendObservationMissing",
          "expr": "fleet_check_expected unless on(project, service, kind, phase) fleet_check_success",
          "for": "3m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "An expected backend has no observation",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "MonitorScrapeFailed",
          "expr": "up == 0",
          "for": "2m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Monitoring cannot scrape a configured target",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "FleetCollectorMissing",
          "expr": "absent(fleet_collector_cycle_timestamp_seconds{collector=\"fast\"})",
          "for": "3m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Fleet collector data is missing",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "FleetCollectorStale",
          "expr": "time() - fleet_collector_cycle_timestamp_seconds > 2 * fleet_collector_interval_seconds + 120",
          "for": "2m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "A collector has stopped updating",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "HostDiskLow",
          "expr": "fleet_host_disk_free_ratio < 0.15",
          "for": "10m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Production host has less than 15 percent free disk",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "HostMemoryHigh",
          "expr": "fleet_host_memory_used_ratio > 0.90",
          "for": "10m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Production host memory exceeds 90 percent",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "TelemetryIntegrationFailed",
          "expr": "fleet_integration_configured == 1 and on(project, source) fleet_integration_success == 0",
          "for": "15m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "A configured telemetry integration failed",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "TelemetryNotConfigured",
          "expr": "fleet_integration_configured == 0",
          "for": "15m",
          "labels": {
            "severity": "info"
          },
          "annotations": {
            "summary": "A requested telemetry source needs configuration or authorization",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "WorkerErrors",
          "expr": "fleet_worker_errors_window > 0",
          "for": "5m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "A Worker reported errors in its sliding five minute window",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "TLSExpirySoon",
          "expr": "(probe_ssl_earliest_cert_expiry{job=\"websites\"} - time()) / 86400 < 14",
          "for": "30m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "A public TLS certificate expires within fourteen days",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        },
        {
          "alert": "LogsDeliveryFailed",
          "expr": "fleet_logs_last_push_success == 0",
          "for": "5m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Central logs have failed delivery",
            "runbook_url": "https://github.com/mithudso/llms-explorer/blob/main/docs/operations/observability.md"
          }
        }
      ]
    }
  ]
}
