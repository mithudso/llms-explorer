[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-library-service"
version = "0.1.0"
description = "Versioned MongoDB research library, evidence-safe coordination and MCP"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pymongo>=4.15,<5", "python-dotenv>=1.1,<2", "mcp>=1.30,<3"]

[project.scripts]
research-library = "research_library_service.cli:main"
research-library-mcp = "research_library_service.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mongomock>=4.3,<5", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
