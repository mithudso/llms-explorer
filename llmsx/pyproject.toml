[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsx"
version = "0.1.0"
description = "Read-only CLI and TUI over the generated llms-explorer concept tree and llms-concept-abstractor concept packs, plus a thin CLI over the skills SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LLMS-Explorer Contributors" }]
keywords = ["llms.txt", "cli", "tui", "concept-tree", "agent-skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://llms-explorer.com"
Repository = "https://github.com/mithudso/llms-explorer"
Issues = "https://github.com/mithudso/llms-explorer/issues"

[project.optional-dependencies]
# Textual is an EXTRA on purpose: `llmsx tree …` / `llmsx concepts …` must run
# with no third-party dependency at all, so CI and a bare box can use them.
# Only `llmsx tui` and `llmsx concepts tui` need it. `rich` is declared
# explicitly even though Textual currently pulls it in transitively — `tui.py`
# imports `rich.text.Text` directly, so this extra must not depend on that
# remaining true of some future Textual release.
tui = ["textual>=8,<9", "rich>=13"]
# The `skills` extra is for anyone using `llmsx.skills` at all, not only
# `run_skill`'s *default* client: `anthropic` is that default HTTP client,
# but `PyYAML` is the preferred frontmatter parser used by `load_skill` on
# every call (see `skills._parse_frontmatter`) regardless of which client a
# caller injects. A caller who wants only the bounded fallback parser and
# never calls `run_skill` can still install just `PyYAML` on its own.
skills = ["anthropic>=1,<2", "PyYAML>=6,<7"]
dev = ["pytest>=8", "ruff", "textual>=8,<9", "rich>=13", "anthropic>=1,<2", "PyYAML>=6,<7"]

[project.scripts]
llmsx = "llmsx.__main__:main"

[tool.setuptools.packages.find]
include = ["llmsx*"]

[tool.setuptools.package-data]
llmsx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E402", "BLE001", "SIM105"]
