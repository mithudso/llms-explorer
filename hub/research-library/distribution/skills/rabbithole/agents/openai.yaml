interface:
  display_name: "Rabbithole Research"
  short_description: "Deepen one concept with measured new evidence"
  default_prompt: "Use $rabbithole to deepen one concept through primary evidence and persist the growing claim set in MongoDB."

dependencies:
  tools:
    - type: "mcp"
      value: "research-library"
      description: "Shared MongoDB research library"
      transport: "streamable_http"
      url: "https://research-mcp.llms-explorer.com/mcp"
