# Reviewed articles stay outside the content collection until their daily slot.
# The script enforces one publication per America/New_York day, including reruns
# and overdue backlogs. 14:00 UTC is 09:00 EST / 10:00 EDT; it never publishes
# before 09:00 local time. The site's existing Pages Git integration deploys main.
name: publish-scheduled

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Promote at most one reviewed due article
        id: promote
        run: |
          promoted="$(python3 site/tools/promote_scheduled_posts.py)"
          echo "$promoted"
          echo "promoted=$promoted" >> "$GITHUB_OUTPUT"

      - name: Commit the article and its daily receipt
        if: steps.promote.outputs.promoted != '[]'
        run: |
          git config user.name "llms-explorer scheduler"
          git config user.email "scheduler@llms-explorer.invalid"
          git add site/scheduled-posts site/scheduled-assets site/public/downloads/research site/src/content/blog site/src/data/publication-ledger.json
          git commit -m "chore(blog): publish one reviewed scheduled article"
          git push origin HEAD:main

      # GITHUB_TOKEN pushes do not trigger another Actions push workflow. Run
      # the site's validation explicitly; its existing Pages Git integration
      # remains responsible for deployment. This workflow sends no messages.
      - name: Run site validation for the published revision
        if: steps.promote.outputs.promoted != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
