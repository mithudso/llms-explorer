apiVersion: 1
datasources:
  - name: Fleet metrics
    uid: fleet-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
      manageAlerts: true
      prometheusType: Prometheus
  - name: Central logs
    uid: fleet-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData: {maxLines: 500}
