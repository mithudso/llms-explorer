[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explorer-api"
version = "0.1.0"
description = "Accounts, metering, hosted MCP gateway and governance for LLMS-Explorer"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    # Task 3 — sign-in: signed session/ceremony cookies, WebAuthn, OAuth clients.
    "itsdangerous>=2.2",
    "webauthn>=2.0",
    "httpx>=0.27",
    "argon2-cffi>=23.1.0",
    "stripe>=10.0.0",
]

[project.optional-dependencies]
# Added task by task as each surface lands (Task 2: sqlalchemy/alembic/asyncpg,
# Task 3: webauthn/authlib, Task 4: argon2-cffi, Task 6: stripe).
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["explorer_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Task 2's database tests are `async def` with no decorator, as the plan writes them.
asyncio_mode = "auto"
