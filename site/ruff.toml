# Lint config for the site's Python tools and tests. Mirrors the hub's
# (hub/pyproject.toml [tool.ruff]) rule set exactly, so a file that moves
# between the two trees lints the same way.
target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = [
    "E402",    # deliberate late imports after sys.path setup
    "BLE001",  # broad excepts are annotated inline where intentional
    "SIM105",  # contextlib.suppress not always clearer
]
